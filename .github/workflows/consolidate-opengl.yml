name: Consolidate OpenGL sources
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: consolidate-opengl
  cancel-in-progress: false
jobs:
  migrate:
    if: github.actor == '476139183'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      KNOWLEDGE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
      - name: Import and verify fixed snapshots
        run: |
          cp scripts/migration/inventory.json /tmp/opengl-sources-inventory.json
          python3 scripts/migration/import_snapshots.py
      - name: Preserve every source branch and tag
        run: python3 scripts/migration/preserve_histories.py
      - name: Build source catalog
        run: python3 scripts/migration/build_catalog.py
      - name: Verify archived files and history tags
        run: python3 scripts/verify_collections.py
      - name: Publish verified consolidation
        run: |
          git config user.name '476139183'
          git config user.email '476139183@users.noreply.github.com'
          mkdir -p .git/info
          echo 'collections/** -text -filter -ident' >> .git/info/attributes
          git -c core.autocrlf=false add --force collections catalog readme.md SOURCES.md scripts/verify_collections.py
          python3 scripts/migration/verify_staged.py
          if ! git diff --cached --quiet; then
            git commit -m '归纳合并OpenGL资料并保留各来源分支与标签历史'
          fi
          git push --atomic origin HEAD:refs/heads/master 'refs/tags/legacy/*:refs/tags/legacy/*'
